version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "org.glassfish.jaxb:jaxb-runtime"
        update-types: [ "version-update:semver-major" ]
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directories:
      - "/hackathon-templates/public"
      - "/hackathon-templates/client-secret"
      - "/hackathon-templates/private-key-jwt"
      - "/hackathon-templates/backend-services"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
