ktor:
  application:
    modules:
      - no.nav.helse.ApplicationKt.module
  deployment:
    port: 8080

database:
  url: ${READWRITE_PGJDBCURL}
  migrationUrl: ${PGJDBCURL}
  seedTestdata: true

ehr:
  baseUrl: "http://localhost:8080"


auth:
  helseId:
    wellKnownUrl: ${WONDERWALL_OPENID_WELL_KNOWN_URL}
    clientId: ${WONDERWALL_OPENID_CLIENT_ID}

smart:
  privateKeyJwk: ${PRIVATE_KEY_JWK}
  issuerBaseUrl: ${SMART_ISSUER_BASE_URL}
  fhirServerUrl: ${FHIR_SERVER_URL}
  clients:
    - clientId: "syk-inn"
      name: "Sykmelding"
      description: "Skriv sykmelding og send den til Nav."
      icon: "sick-note"
      launchMode: "ask"
      redirectUris: [ "https://www.ekstern.dev.nav.no/samarbeidspartner/sykmelding", "https://www.ekstern.dev.nav.no/samarbeidspartner/sykmelding/fhir/callback" ]
      launchUris: [ "https://www.ekstern.dev.nav.no/samarbeidspartner/sykmelding/fhir/launch" ]
      tokenEndpointAuthMethod: "client_secret_basic"
      clientSecret: ${SYK_INN_CLIENT_SECRET}
      scopes:
        - openid
        - profile
        - fhirUser
        - launch
        - offline_access
        - patient/Patient.rs
        - patient/Encounter.rs
        - patient/Condition.rs
        - patient/Observation.rs
        - patient/Observation.write
        - patient/DocumentReference.crs
    - clientId: "NAV_SMART_on_FHIR_validator"
      name: "Validator"
      description: "Tester SMART on FHIR-oppstart og FHIR-API-et mot nav-epj."
      icon: "validator"
      launchMode: "iframe"
      redirectUris: [ "https://nav-on-fhir.ekstern.dev.nav.no/callback" ]
      launchUris: [ "https://nav-on-fhir.ekstern.dev.nav.no/launch" ]
      tokenEndpointAuthMethod: "private_key_jwt"
      jwksUri: "https://nav-on-fhir.ekstern.dev.nav.no/.well-known/jwks.json"
      scopes:
        - openid
        - fhirUser
        - launch
        - launch/patient
        - offline_access
        - patient/Patient.rs
        - patient/Practitioner.rs
        - patient/PractitionerRole.rs
        - patient/Organization.rs
        - patient/Encounter.rs
        - patient/Condition.rs
        - patient/Observation.rs
        - patient/Observation.write
        - patient/DocumentReference.cruds
        - patient/Binary.cruds
        - patient/QuestionnaireResponse.cruds
    - clientId: "hackathon-public"
      name: "Hackathon starter"
      description: "Delt klient for hackathon-apper som kjører på localhost:3100."
      launchMode: "tab"
      redirectUris: [ "http://localhost:3100/callback" ]
      launchUris: [ "http://localhost:3100/launch" ]
      tokenEndpointAuthMethod: "none"
      scopes:
        - openid
        - fhirUser
        - profile
        - launch
        - launch/patient
        - launch/encounter
        - offline_access
        - online_access
        - patient/*.cruds
        - user/*.cruds
    - clientId: "hackathon-2027-123"
      tokenEndpointAuthMethod: "private_key_jwt"
      grantTypes: [ "client_credentials" ]
      jwkSet: |
        {"keys":[{"kty":"RSA","n":"4pVxFRRxEljJ7j1rEk9n6BUsIyMvLihw22-cd7ClA3Ysl8_MTavs3NvCS7_p12YgsNMl8Xz4SxdMB5ou_AI2SABwGq7mI6ukzV4B5QuugmbtH-MWfRDlSE3PiFAO74FBjHnFPX-mTrPbTMWkcNPz9hGqMKZ3JvtJ2sx9ruuSwvcEF9fTkBJvj98BCrfGafMXKCCqLlYKJYe4aZdu0sAWGxWaNFNJiiifGaNFBXMD_BgxTZvpPB6Qlm_EIVbs5bfDiWnRMncyW4-3Ohxpm2XWtG6Bj8sIxciyo3uLfyYYNMAhT4ncDXfVxnoh_7wVl7CGQriJxr-7tXsDtCM_uy9tK9MXgApXB-Z2u9EbBetKwR1ELMaTJgwFFYHh_otdGkd5NnFDzT3dwNjRpmjLfkijtL9L20783g8McKIDUSn_XwJ6v7pZrLRxxVHNJbq9UrIgHsuqWf9uC-UIQ8pb3uMmlR4uPui0EeIB5X4CH0T-QbDfXJ63BYEHjsZtzKKhjnvb","e":"AQAB","alg":"RS384","use":"sig","kid":"c1XPBZNiRZ01rGvm6waqJ_J3rwJVy-AJxPjYUSA7U9g"}]}
      scopes:
        - system/Patient.rs
        - system/Encounter.rs
        - system/Condition.s
        - system/Observation.crs
        - system/Practitioner.r
        - system/PractitionerRole.s
        - system/Organization.r
        - system/DocumentReference.crs
    - clientId: "forer-legeerklaering-poc"
      name: "Legeerklæring førerrett"
      description: "Helseattest førerett (IS-2569) i Altinn, forhåndsutfylt fra EPJ."
      launchMode: "tab"
      redirectUris: [ "https://ttd.apps.tt02.altinn.no/ttd/forer-legeerklaering/smart/callback" ]
      launchUris: [ "https://ttd.apps.tt02.altinn.no/ttd/forer-legeerklaering/smart/launch" ]
      tokenEndpointAuthMethod: "client_secret_basic"
      clientSecret: ${FORER_LEGEERKLAERING_CLIENT_SECRET}
      scopes:
        - openid
        - profile
        - fhirUser
        - launch
        - launch/patient
        - launch/encounter
        - offline_access
        - patient/Patient.rs
        - patient/Encounter.rs
        - patient/Condition.rs
        - patient/DocumentReference.c
        - user/Practitioner.rs
        - user/PractitionerRole.rs
        - user/Organization.rs

valkey:
  host: ${VALKEY_HOST_NAV_EPJ}
  port: ${VALKEY_PORT_NAV_EPJ}
  useTLS: true
  username: ${VALKEY_USERNAME_NAV_EPJ}
  password: ${VALKEY_PASSWORD_NAV_EPJ}

